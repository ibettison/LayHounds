<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Greyhound hero preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .wrap { padding: 48px; }
    .hero { position: relative; width: 520px; }
    .glow {
      position: absolute;
      inset: -16px;
      border-radius: 24px;
      background: linear-gradient(135deg, #fbcfe8, #fdf2f8, transparent);
      filter: blur(28px);
      opacity: .65;
    }
    .dog {
      position: absolute;
      right: -32px;
      top: -56px;
      z-index: 20;
      width: 176px;
      transform: rotate(3deg);
    }
    .dog-frame {
      overflow: hidden;
      border-radius: 18px;
      border: 4px solid white;
      background: white;
      box-shadow: 0 25px 50px rgba(15, 23, 42, .22);
    }
    .dog img {
      display: block;
      width: 100%;
      height: 192px;
      object-fit: cover;
      object-position: 45% 34%;
    }
    .panel {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      background: #0f172a;
      box-shadow: 0 25px 50px rgba(15, 23, 42, .25);
    }
    .chrome {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .red { background: #f87171; }
    .amber { background: #fbbf24; }
    .green { background: #34d399; }
    .url {
      margin-left: 12px;
      color: #94a3b8;
      font: 10px ui-monospace, monospace;
      text-transform: uppercase;
      letter-spacing: .16em;
    }
    .screen {
      aspect-ratio: 4 / 3;
      background: #0a0a0a;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .tile {
      background: #141414;
      border: 1px solid #2a2a2a;
      padding: 12px;
    }
    .label {
      color: #71717a;
      font: 9px ui-monospace, monospace;
      text-transform: uppercase;
      letter-spacing: .16em;
    }
    .value {
      margin-top: 4px;
      color: white;
      font: 700 16px ui-monospace, monospace;
    }
    .win { color: #34d399; }
    .warn { color: #fbbf24; }
    .chart { grid-column: 1 / -1; }
    .bars {
      display: flex;
      align-items: end;
      gap: 4px;
      height: 48px;
      margin-top: 8px;
    }
    .bar {
      flex: 1;
      border-radius: 2px;
      background: linear-gradient(0deg, #ec4899, #f472b6);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="glow"></div>
      <div class="dog" aria-hidden="true">
        <div class="dog-frame">
          <img src="https://unsplash.com/photos/2B6b5tyWDWk/download?force=true&w=520" alt="" />
        </div>
      </div>
      <div class="panel">
        <div class="chrome">
          <span class="dot red"></span>
          <span class="dot amber"></span>
          <span class="dot green"></span>
          <span class="url">lay-hounds.co.uk/app</span>
        </div>
        <div class="screen">
          <div class="grid">
            <div class="tile"><div class="label">Bank</div><div class="value win">&pound;1,247.20</div></div>
            <div class="tile"><div class="label">P&amp;L</div><div class="value win">+&pound;47.20</div></div>
            <div class="tile"><div class="label">Races</div><div class="value">23/100</div></div>
            <div class="tile"><div class="label">Stake</div><div class="value">&pound;0.50</div></div>
            <div class="tile"><div class="label">Recovery</div><div class="value warn">L2</div></div>
            <div class="tile"><div class="label">Win Rate</div><div class="value win">84%</div></div>
            <div class="tile chart">
              <div class="label">Daily P&amp;L</div>
              <div class="bars">
                <div class="bar" style="height:20%"></div>
                <div class="bar" style="height:35%"></div>
                <div class="bar" style="height:50%"></div>
                <div class="bar" style="height:30%"></div>
                <div class="bar" style="height:45%"></div>
                <div class="bar" style="height:65%"></div>
                <div class="bar" style="height:80%"></div>
                <div class="bar" style="height:75%"></div>
                <div class="bar" style="height:90%"></div>
                <div class="bar" style="height:70%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
